<div class="project-list">{% assign projects = site.projects | sort: 'order' %}{% for project in projects %}{% if include.all or project.featured %}<article class="project-row"><div class="project-type">{{ project.kind }}</div><div class="project-main"><h3><a href="{{ project.link | relative_url }}">{{ project.title }}</a></h3><p>{{ project.summary }}</p></div><a class="row-arrow" href="{{ project.link | relative_url }}" aria-label="打开 {{ project.title }}">↗</a></article>{% endif %}{% endfor %}</div>
