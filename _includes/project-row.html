{% assign project = include.project %}{% assign source = project %}{% assign destination = project.link %}{% if source and destination %}<article class="project-row"><div class="project-type">{{ project.kind }}</div><div class="project-main"><h3><a href="{{ destination | relative_url }}">{{ source.title }}</a></h3><p>{{ source.summary }}</p></div><a class="row-arrow" href="{{ destination | relative_url }}" aria-label="打开 {{ source.title }}">↗</a></article>{% endif %}
